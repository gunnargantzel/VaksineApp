    <!-- MSAL.js CDN with fallback -->
    <script>
      // Function to ensure fetch API is on globalThis (defined before use)
      function ensureFetchApiOnGlobalThis() {
        const g = (typeof globalThis !== 'undefined') ? globalThis : window;
        
        // Ensure globalThis exists and points to window
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }
        if (g !== window && typeof window.globalThis !== 'undefined') {
          window.globalThis = window;
        }
        
        // Helper function to define property on globalThis
        function defineOnGlobalThis(name, value) {
          if (typeof globalThis !== 'undefined' && typeof globalThis[name] === 'undefined') {
            try {
              Object.defineProperty(globalThis, name, {
                value: value,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              globalThis[name] = value;
            }
          }
        }
        
        // Copy from window to globalThis using defineProperty for robustness
        if (typeof window.Request !== 'undefined') {
          if (typeof g.Request === 'undefined') {
            g.Request = window.Request;
          }
          defineOnGlobalThis('Request', window.Request);
        }
        if (typeof window.Response !== 'undefined') {
          if (typeof g.Response === 'undefined') {
            g.Response = window.Response;
          }
          defineOnGlobalThis('Response', window.Response);
        }
        if (typeof window.Headers !== 'undefined') {
          if (typeof g.Headers === 'undefined') {
            g.Headers = window.Headers;
          }
          defineOnGlobalThis('Headers', window.Headers);
        }
        if (typeof window.fetch !== 'undefined') {
          if (typeof g.fetch === 'undefined') {
            g.fetch = window.fetch;
          }
          defineOnGlobalThis('fetch', window.fetch);
        }
        
        // Also ensure they're accessible directly
        if (typeof g.Request !== 'undefined') {
          if (typeof Request === 'undefined') {
            // Make Request available in global scope
            try {
              Object.defineProperty(window, 'Request', {
                value: g.Request,
                writable: true,
                configurable: true
              });
            } catch (e) {
              window.Request = g.Request;
            }
          }
        }
        
        console.log('Fetch API ensured on globalThis:', {
          Request: typeof g.Request !== 'undefined',
          Response: typeof g.Response !== 'undefined',
          Headers: typeof g.Headers !== 'undefined',
          fetch: typeof g.fetch !== 'undefined',
          globalThisExists: typeof globalThis !== 'undefined',
          globalThisRequest: typeof globalThis !== 'undefined' ? typeof globalThis.Request !== 'undefined' : false
        });
      }
      
      // Load MSAL with fallback
      function loadMSAL() {
        // CRITICAL: Ensure fetch API is available on globalThis before loading MSAL
        ensureFetchApiOnGlobalThis();
        
        // Final safety check - ensure Request is definitely on globalThis and accessible
        const g = (typeof globalThis !== 'undefined') ? globalThis : window;
        
        // Force Request onto globalThis if it exists on window
        if (typeof window.Request !== 'undefined') {
          g.Request = window.Request;
          // Also set it directly on globalThis object
          if (typeof globalThis !== 'undefined') {
            globalThis.Request = window.Request;
            globalThis.Response = window.Response || globalThis.Response;
            globalThis.Headers = window.Headers || globalThis.Headers;
            globalThis.fetch = window.fetch || globalThis.fetch;
          }
        }
        
        // Wait a moment to ensure everything is set up
        setTimeout(function() {
          // Double-check before loading
          ensureFetchApiOnGlobalThis();
          const g = (typeof globalThis !== 'undefined') ? globalThis : window;
          if (typeof window.Request !== 'undefined' && typeof g.Request === 'undefined') {
            g.Request = window.Request;
            if (typeof globalThis !== 'undefined') {
              globalThis.Request = window.Request;
            }
          }
          
          const script = document.createElement('script');
          script.src = 'https://alcdn.msauth.net/browser/2.20.0/js/msal-browser.min.js';
          script.onload = function() {
            console.log('MSAL loaded successfully');
            console.log('MSAL available:', typeof window.msal);
            if (window.msal) {
              console.log('MSAL PublicClientApplication available:', !!window.msal.PublicClientApplication);
            }
          };
          script.onerror = function() {
            console.error('Failed to load MSAL from primary CDN, trying fallback...');
            // Try fallback CDN
            const fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://unpkg.com/@azure/msal-browser@2.20.0/dist/msal-browser.min.js';
            fallbackScript.onload = function() {
              console.log('MSAL loaded from fallback CDN');
            };
            fallbackScript.onerror = function() {
              console.error('Failed to load MSAL from both CDNs');
            };
            document.head.appendChild(fallbackScript);
          };
          document.head.appendChild(script);
        }, 50); // Small delay to ensure everything is set up
      }
      
      // MSAL will be loaded after fetch polyfill is ready
    </script>

  <body>
    <div id="root"></div>
    <script>
      // CRITICAL: Set up globalThis FIRST before anything else
      // MSAL's fetch.js tries to destructure Request from globalThis immediately
      if (typeof globalThis === 'undefined') {
        window.globalThis = window;
      }
      
      // Ensure globalThis always points to window
      if (globalThis !== window) {
        globalThis = window;
      }
      
      // Comprehensive polyfills for browser compatibility
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof process === 'undefined') {
        window.process = { 
          env: {}, 
          platform: 'browser', 
          version: 'v16.0.0',
          browser: true,
          nextTick: (fn) => setTimeout(fn, 0)
        };
      }
      if (typeof Buffer === 'undefined') {
        window.Buffer = { isBuffer: () => false };
      }
      // Define require to return fetch API objects if MSAL tries to use it
      if (typeof require === 'undefined') {
        window.require = function(moduleName) {
          // If MSAL tries to require something related to fetch, return our polyfill
          if (moduleName && (moduleName.includes('fetch') || moduleName.includes('Request'))) {
            const g = (typeof globalThis !== 'undefined') ? globalThis : window;
            return {
              Request: g.Request || window.Request,
              Response: g.Response || window.Response,
              Headers: g.Headers || window.Headers,
              fetch: g.fetch || window.fetch
            };
          }
          return {};
        };
      }
      
      // IMMEDIATELY copy fetch API to globalThis for MSAL compatibility
      // MSAL's fetch.js tries to destructure Request from globalThis at module load time
      // This must happen BEFORE any scripts that might load MSAL
      (function() {
        // Use IIFE to ensure this runs immediately
        const g = (typeof globalThis !== 'undefined') ? globalThis : window;
        
        // Helper function to define property on globalThis
        function defineOnGlobalThis(name, value) {
          if (typeof globalThis !== 'undefined' && typeof globalThis[name] === 'undefined') {
            try {
              Object.defineProperty(globalThis, name, {
                value: value,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              globalThis[name] = value;
            }
          }
        }
        
        // Copy Request if available - use defineProperty for robustness
        if (typeof window.Request !== 'undefined') {
          if (typeof g.Request === 'undefined') {
            g.Request = window.Request;
          }
          defineOnGlobalThis('Request', window.Request);
        }
        
        // Copy Response if available
        if (typeof window.Response !== 'undefined') {
          if (typeof g.Response === 'undefined') {
            g.Response = window.Response;
          }
          defineOnGlobalThis('Response', window.Response);
        }
        
        // Copy Headers if available
        if (typeof window.Headers !== 'undefined') {
          if (typeof g.Headers === 'undefined') {
            g.Headers = window.Headers;
          }
          defineOnGlobalThis('Headers', window.Headers);
        }
        
        // Copy fetch if available
        if (typeof window.fetch !== 'undefined') {
          if (typeof g.fetch === 'undefined') {
            g.fetch = window.fetch;
          }
          defineOnGlobalThis('fetch', window.fetch);
        }
        
        // Also ensure they're on window if not already
        if (typeof g.Request !== 'undefined' && typeof window.Request === 'undefined') {
          window.Request = g.Request;
        }
        if (typeof g.Response !== 'undefined' && typeof window.Response === 'undefined') {
          window.Response = g.Response;
        }
        if (typeof g.Headers !== 'undefined' && typeof window.Headers === 'undefined') {
          window.Headers = g.Headers;
        }
        if (typeof g.fetch !== 'undefined' && typeof window.fetch === 'undefined') {
          window.fetch = g.fetch;
        }
      })();
      
      // Create a custom fetch wrapper to prevent MSAL fetch.js errors
      console.log('Creating custom fetch wrapper...');
      
      // Store original fetch if it exists
      const originalFetch = window.fetch;
      
      // Create a custom fetch that handles Request properly
      window.fetch = function(input, init) {
        try {
          // Ensure Request is properly defined
          if (typeof Request === 'undefined') {
            console.log('Request not available, using fallback...');
            // Simple fallback for Request
            if (typeof input === 'string') {
              return originalFetch ? originalFetch(input, init) : Promise.reject(new Error('No fetch available'));
            }
          }
          
          // Use original fetch if available
          if (originalFetch) {
            return originalFetch(input, init);
          }
          
          // Fallback to XMLHttpRequest if no fetch
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open(init?.method || 'GET', input);
            xhr.onload = () => resolve({
              ok: xhr.status >= 200 && xhr.status < 300,
              status: xhr.status,
              text: () => Promise.resolve(xhr.responseText),
              json: () => Promise.resolve(JSON.parse(xhr.responseText))
            });
            xhr.onerror = () => reject(new Error('Network error'));
            xhr.send(init?.body);
          });
        } catch (error) {
          console.error('Custom fetch error:', error);
          return Promise.reject(error);
        }
      };
      
      // Load fetch polyfill first, before MSAL
      console.log('Loading fetch polyfill...');
      
      // Function to ensure fetch API is copied after polyfill loads
      function ensureAfterPolyfillLoad() {
        // Wait a tick to ensure polyfill has fully initialized
        setTimeout(function() {
          ensureFetchApiOnGlobalThis();
          
          // Double-check that Request is on globalThis
          const g = (typeof globalThis !== 'undefined') ? globalThis : window;
          if (typeof window.Request !== 'undefined' && typeof g.Request === 'undefined') {
            g.Request = window.Request;
            console.log('Copied Request to globalThis after polyfill load');
          }
          if (typeof window.Response !== 'undefined' && typeof g.Response === 'undefined') {
            g.Response = window.Response;
            console.log('Copied Response to globalThis after polyfill load');
          }
          if (typeof window.Headers !== 'undefined' && typeof g.Headers === 'undefined') {
            g.Headers = window.Headers;
            console.log('Copied Headers to globalThis after polyfill load');
          }
          if (typeof window.fetch !== 'undefined' && typeof g.fetch === 'undefined') {
            g.fetch = window.fetch;
            console.log('Copied fetch to globalThis after polyfill load');
          }
          
          // Now load MSAL after fetch is available
          loadMSAL();
        }, 10);
      }
      
      const fetchScript = document.createElement('script');
      fetchScript.src = 'https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.js';
      fetchScript.onload = function() {
        console.log('Fetch polyfill loaded successfully');
        ensureAfterPolyfillLoad();
      };
      fetchScript.onerror = function() {
        console.error('Failed to load fetch polyfill, trying alternative...');
        // Try alternative fetch polyfill
        const altFetchScript = document.createElement('script');
        altFetchScript.src = 'https://unpkg.com/whatwg-fetch@3.6.2/dist/fetch.umd.js';
        altFetchScript.onload = function() {
          console.log('Alternative fetch polyfill loaded');
          ensureAfterPolyfillLoad();
        };
        altFetchScript.onerror = function() {
          console.error('All fetch polyfills failed, loading MSAL anyway...');
          ensureFetchApiOnGlobalThis();
          // Even if polyfill fails, try to load MSAL with native fetch
          setTimeout(function() {
            loadMSAL();
          }, 10);
        };
        document.head.appendChild(altFetchScript);
      };
      document.head.appendChild(fetchScript);
      
      // Call ensureFetchApiOnGlobalThis immediately to set up everything
      ensureFetchApiOnGlobalThis();
      
      // Ensure Request is available on both window and globalThis
      const g = (typeof globalThis !== 'undefined') ? globalThis : window;
      if (typeof Request === 'undefined' && typeof window.Request === 'undefined') {
        console.log('Request not available, creating polyfill...');
        const RequestPolyfill = function() {
          throw new Error('Request polyfill not fully implemented');
        };
        window.Request = RequestPolyfill;
        g.Request = RequestPolyfill;
      } else if (typeof window.Request !== 'undefined' && typeof g.Request === 'undefined') {
        g.Request = window.Request;
      }
      
      // Ensure Response is available on globalThis
      if (typeof window.Response !== 'undefined' && typeof g.Response === 'undefined') {
        g.Response = window.Response;
      }
      
      // Ensure Headers is available on globalThis
      if (typeof window.Headers !== 'undefined' && typeof g.Headers === 'undefined') {
        g.Headers = window.Headers;
      }
      
      // Final check - ensure everything is on globalThis
      ensureFetchApiOnGlobalThis();
    </script>
